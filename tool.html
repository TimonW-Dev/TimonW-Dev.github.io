<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tool – sysadminsuite.com</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/tiles.css">
  <script src="assets/js/theme.js"></script>
</head>
<body data-root="">
  <header>
    <a class="logo" href="./">sysadminsuite.com</a>
    <div class="header-preferences">
      <div id="site-clock" class="site-clock" aria-live="off">
        <time id="site-date"></time>
        <span id="clock-separator" aria-hidden="true">·</span>
        <time id="site-time"></time>
      </div>
    </div>
    <details class="display-settings">
      <summary aria-label="Date and time settings" title="Date and time settings">⚙</summary>
      <div class="settings-menu">
        <label><input id="show-date" type="checkbox" checked> Show date</label>
        <label><input id="show-time" type="checkbox" checked> Show time</label>
        <label><input id="show-seconds" type="checkbox" checked> Show seconds</label>
      </div>
    </details>
    <div class="search tool-search">
      <input id="tool-search" type="search" placeholder="Search tools…" aria-label="Search tools" autocomplete="off" aria-controls="tool-search-results" aria-expanded="false" aria-autocomplete="list">
      <div id="tool-search-results" class="tool-search-results hidden" role="listbox" aria-label="Matching tools"></div>
    </div>
  </header>
  <main>
    <nav class="crumbs" aria-label="Breadcrumb">
      <a href="./">← Overview</a> <span id="tool-category"></span>
    </nav>
    <h1 id="tool-title">Loading…</h1>
    <p id="tool-desc" class="desc"></p>
    <div id="tool-body" class="tile tool-page-body body"></div>
  </main>
  <footer>
    <a href="pages/imprint.html">Imprint</a>
    <a href="pages/privacy.html">Privacy</a>
    <a href="pages/terms.html">Terms</a>
    <a href="pages/apis.html">APIs</a>
    <a href="https://github.com/TimonW-Dev/TimonW-Dev.github.io?tab=contributing-ov-file">Contribute</a>
    <a href="#" data-consent-reset>Consent</a>
    <a href="#" data-contact>Show contact email</a>
    <p>Use at your own risk. No warranty; liability is excluded to the extent permitted by law.</p>
  </footer>
  <script type="module" src="assets/js/topbar.js"></script>
  <script type="module" src="assets/js/tool-page.js"></script>
</body>
</html>
